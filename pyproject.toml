[project]
name = "tessera-platform"
version = "0.4.2"
description = "Tessera Financial card issuing and payments platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
]

# PEP 735 dependency group. uv installs this by default on `uv run`, so
# `uv run pytest` works straight after clone with no extra flags.
[dependency-groups]
console = [
    "pyyaml>=6",
    "uvicorn>=0.30",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[tool.pytest.ini_options]
testpaths = ["services", "ml", "tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "auto"

[tool.uv]
package = false
# `uv run` installs these groups without flags: tests, the ops console and
# JupyterLab -- so `uv run jupyter nbconvert` works for an agent as well as a human.
default-groups = ["dev", "console", "notebooks"]
